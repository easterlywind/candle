name: CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    name: Lint, Build & Smoke Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run linter (oxlint)
        run: npm run lint

      - name: Typecheck and build production assets
        run: npm run build

      - name: Verify server scripts syntax
        run: |
          node --check server.js
          node --check api/telegram.js

      - name: Smoke test production server
        run: |
          PORT=8080 node server.js &
          SERVER_PID=$!
          sleep 2

          echo "Testing /health endpoint..."
          curl -f http://127.0.0.1:8080/health

          echo "\nTesting /api/telegram simulation endpoint..."
          curl -f -X POST http://127.0.0.1:8080/api/telegram \
            -H "Content-Type: application/json" \
            -d '{"message":"Test CI ping"}'

          echo "\nKilling server process..."
          kill $SERVER_PID
